# guix.yaml: reproducible build configuration
# Docs: https://pub.dev/packages/guix

project:
  name: guix_example

flutter:
  version: "3.24.5"
  channel: stable
  checksums:
    x86_64: "a7c82f551a9eae018e078f6bb186171e5a77920d35a3d75a61d9a593d0a9e4ae"
    aarch64: ""

guix:
  channels: guix/channels.scm

platforms:
  linux:
    manifest: guix/linux.scm
    env:
      CC: clang
      CXX: clang++
    preserve:
      - DISPLAY
      - WAYLAND_DISPLAY
      - XAUTHORITY
      - XDG_RUNTIME_DIR
      - XDG_SESSION_TYPE
      - DBUS_SESSION_BUS_ADDRESS
    build:
      command: flutter build linux --release
      output: build/linux/x64/release/bundle
